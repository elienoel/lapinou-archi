services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lapinou_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=1
    command: python manage.py runserver 0.0.0.0:8000

